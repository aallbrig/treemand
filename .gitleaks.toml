# Extends gitleaks' default rules with patterns that identify *this* AWS
# account. The repo is public and its infrastructure is code, so account
# identifiers must arrive at deploy time (parameters, lookups, GitHub
# secrets), never through git. Tests: scripts/gates_test.sh.
title = "treemand"

[extend]
useDefault = true

[[rules]]
id = "aws-arn-with-account-id"
description = "ARN carrying a 12-digit AWS account ID"
regex = '''arn:aws[a-z-]*:[a-z0-9-]+:[a-z0-9-]*:\d{12}:'''
keywords = ["arn:aws"]

[[rules]]
id = "aws-account-id-assignment"
description = "AWS account ID next to an account-ish key"
regex = '''(?i)(?:account[_-]?id|aws[_-]?account(?:[_-]?id)?|owner[_-]?id)["'`]?\s*[:=]\s*["'`]?(\d{12})\b'''
keywords = ["account", "owner"]

[[rules]]
id = "aws-account-id-in-infra"
description = "Bare 12-digit number in infrastructure or workflow files"
regex = '''\b\d{12}\b'''
path = '''(^|/)(infra|\.github|scripts/infra)/'''

[[rules]]
id = "aws-resource-id-in-infra"
description = "Route 53 zone ID or CloudFront distribution ID in infrastructure or workflow files"
regex = '''\b(?:Z[0-9A-Z]{12,31}|E[0-9A-Z]{12,13})\b'''
path = '''(^|/)(infra|\.github|scripts/infra)/'''
entropy = 3.0

# Generated help-text trees of third-party CLIs; kubectl's own docs contain a
# sample `--password=` value that the default generic-api-key rule flags.
[allowlist]
description = "generated third-party CLI help trees"
paths = ['''(^|/)try/trees/[^/]+\.json$''']
