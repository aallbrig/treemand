# gitleaks and shellcheck run in task precommit (scripts/dev/precommit.sh),
# scoped to the staged files; the framework runs only what it alone does.
repos:
  - repo: https://github.com/python-jsonschema/check-jsonschema
    rev: 0.29.4
    hooks:
      - id: check-jsonschema
        name: validate tmuxinator config
        files: ^\.tmuxinator/.*\.ya?ml$
        args: ["--schemafile", "https://json.schemastore.org/tmuxinator.json"]
