version: 2
updates:
  - package-ecosystem: gomod
    directory: /cli/treemand
    schedule:
      interval: weekly
    groups:
      go-modules:
        patterns: ["*"]
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]
    open-pull-requests-limit: 5
