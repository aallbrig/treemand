name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test & Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cli/treemand

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: cli/treemand/go.mod
          cache-dependency-path: cli/treemand/go.sum

      - name: Install dependencies
        run: go mod download

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "Unformatted files (run: gofmt -w .):"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: latest
          # The prebuilt binary is compiled with an older Go than go.mod targets;
          # build it with the toolchain set up above instead.
          install-mode: goinstall
          working-directory: cli/treemand
          args: --timeout=5m

      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

      - name: Test with coverage
        run: go test -v -race -coverprofile=coverage.out -covermode=atomic ./...

      - name: Coverage floor
        working-directory: .
        run: bash scripts/check_coverage.sh

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          file: cli/treemand/coverage.out
          fail_ci_if_error: false

      - name: Build
        run: go build -o treemand .

  gates:
    name: Task ci (all gates)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: cli/treemand/go.mod
          cache-dependency-path: cli/treemand/go.sum

      - uses: arduino/setup-task@v2
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install tooling
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq tmux tmuxinator shellcheck jq
          go install golang.org/x/vuln/cmd/govulncheck@latest
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "0.157.0"
          extended: true

      - name: task ci
        run: task ci

  build-matrix:
    name: Cross-platform build
    runs-on: ubuntu-latest
    needs: test
    strategy:
      matrix:
        include:
          - {goos: linux, goarch: amd64}
          - {goos: linux, goarch: arm64}
          - {goos: darwin, goarch: amd64}
          - {goos: darwin, goarch: arm64}
          - {goos: windows, goarch: amd64}
    defaults:
      run:
        working-directory: cli/treemand
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: cli/treemand/go.mod
      - name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: go build -ldflags="-s -w" -o treemand_${{ matrix.goos }}_${{ matrix.goarch }} .

  # The published install script against the real latest release, in clean
  # containers (no Go, no treemand, minimal tools) and on macOS (shasum, not
  # sha256sum). Needs network and an existing release.
  install-script:
    name: install.sh in a clean container (${{ matrix.image }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: debian:stable-slim
            prep: apt-get update -qq && apt-get install -y -qq curl ca-certificates
          - image: ubuntu:24.04
            prep: apt-get update -qq && apt-get install -y -qq curl ca-certificates
          - image: alpine:3
            prep: apk add --no-cache curl ca-certificates
    steps:
      - uses: actions/checkout@v4
      - name: Install the latest release, then a pinned one
        run: |
          docker run --rm -v "$PWD/www/treemand/static/install.sh:/install.sh:ro" ${{ matrix.image }} sh -c '
            set -eu
            ${{ matrix.prep }} >/dev/null
            sh /install.sh
            export PATH="$HOME/.local/bin:$PATH"
            treemand version
            test -f "$HOME/.local/share/man/man1/treemand.1"
            sh /install.sh --version v0.5.0 --dir /tmp/pinned
            /tmp/pinned/treemand version | grep -q v0.5.0'

  install-script-macos:
    name: install.sh on macOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install the latest release
        run: |
          sh www/treemand/static/install.sh
          "$HOME/.local/bin/treemand" version

