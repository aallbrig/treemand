name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test & Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cli/treemand

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: cli/treemand/go.mod
          cache-dependency-path: cli/treemand/go.sum

      - name: Install dependencies
        run: go mod download

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "Unformatted files (run: gofmt -w .):"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: latest
          # The prebuilt binary is compiled with an older Go than go.mod targets;
          # build it with the toolchain set up above instead.
          install-mode: goinstall
          working-directory: cli/treemand
          args: --timeout=5m

      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

      - name: Test with coverage
        run: go test -v -race -coverprofile=coverage.out -covermode=atomic ./...

      - name: Coverage floor
        working-directory: .
        run: sh scripts/check_coverage.sh

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          file: cli/treemand/coverage.out
          fail_ci_if_error: false

      - name: Build
        run: go build -o treemand .

  # Go tests on darwin. The full gate suite (task ci) stays on Linux; this
  # job exists because platform-specific code (such as the config directory)
  # otherwise never runs under test on macOS.
  test-macos:
    name: Go tests on macOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: cli/treemand/go.mod
          cache-dependency-path: cli/treemand/go.sum

      - name: go test -race (unit and e2e)
        run: go test -race -count=1 ./cli/treemand/...

      - name: Corpus (task corpus:test)
        run: go test -count=1 -run TestCorpus ./cli/treemand/discovery

  gates:
    name: Task ci (all gates)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # secrets:history scans every commit

      - uses: actions/setup-go@v5
        with:
          go-version-file: cli/treemand/go.mod
          cache-dependency-path: cli/treemand/go.sum

      - uses: arduino/setup-task@v2
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install tooling
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq tmux tmuxinator shellcheck jq
          go install golang.org/x/vuln/cmd/govulncheck@latest
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.27.2/gitleaks_8.27.2_linux_x64.tar.gz \
            | sudo tar -xz -C /usr/local/bin gitleaks
          pipx install cfn-lint==1.59.0
          pipx install checkov==3.2.529
          pipx install ruff==0.17.6
          pipx install mypy==2.4.1

      - uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "0.157.0"
          extended: true

      - name: task ci
        run: task ci

  measure:
    name: Measurement gate (ratchets)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the complexity probe reads git churn
      - uses: actions/setup-go@v5
        with:
          go-version-file: cli/treemand/go.mod
          cache-dependency-path: cli/treemand/go.sum
      # Deterministic probes only: timing history belongs to the host that
      # recorded it. A regression against docs/metrics fails the PR; a fix
      # that improves a metric records the new value (treemand-measure).
      - name: complexity
        run: python3 -I scripts/metrics/measure.py complexity --gate
      - name: parser
        run: python3 -I scripts/metrics/measure.py parser --gate
      - name: tui-layout
        run: python3 -I scripts/metrics/measure.py tui-layout --gate
      - name: tui-keymap
        run: python3 -I scripts/metrics/measure.py tui-keymap --gate
      - name: tui-contrast
        run: python3 -I scripts/metrics/measure.py tui-contrast --gate
      - name: shell-portability
        run: python3 -I scripts/metrics/measure.py shell-portability --gate

  build-matrix:
    name: Cross-platform build
    runs-on: ubuntu-latest
    needs: test
    strategy:
      matrix:
        include:
          - {goos: linux, goarch: amd64}
          - {goos: linux, goarch: arm64}
          - {goos: darwin, goarch: amd64}
          - {goos: darwin, goarch: arm64}
          - {goos: windows, goarch: amd64}
    defaults:
      run:
        working-directory: cli/treemand
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: cli/treemand/go.mod
      - name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: go build -ldflags="-s -w" -o treemand_${{ matrix.goos }}_${{ matrix.goarch }} .

  # A GoReleaser dry run (no signing, nothing published), checked against the
  # asset contract install.sh, the mirror, the tap and the package managers
  # rely on, so a release config change fails here, not on release day.
  release-snapshot:
    name: Release snapshot
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: cli/treemand/go.mod
          cache-dependency-path: cli/treemand/go.sum
      - name: Install syft (SBOMs)
        id: syft
        uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          syft-version: v1.56.0
      - name: Put syft on PATH
        env:
          SYFT: ${{ steps.syft.outputs.cmd }}
        run: dirname "$SYFT" >>"$GITHUB_PATH"
      - name: GoReleaser snapshot
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: v2.19.0
          args: release --snapshot --clean --skip=sign
          workdir: cli/treemand
      - name: Check the release asset contract
        run: sh scripts/release/snapshot_test.sh cli/treemand/dist

  # The published install script against the real latest release, in clean
  # containers (no Go, no treemand, minimal tools) and on macOS (shasum, not
  # sha256sum). Needs network and an existing release.
  install-script:
    name: install.sh in a clean container (${{ matrix.image }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: debian:stable-slim
            prep: apt-get update -qq && apt-get install -y -qq curl ca-certificates
          - image: ubuntu:24.04
            prep: apt-get update -qq && apt-get install -y -qq curl ca-certificates
          - image: alpine:3
            prep: apk add --no-cache curl ca-certificates
    steps:
      - uses: actions/checkout@v4
      - name: Install the latest release from treemand.dev, then an old one from GitHub
        run: |
          docker run --rm -v "$PWD/www/treemand/static/install.sh:/install.sh:ro" ${{ matrix.image }} sh -c '
            set -eu
            ${{ matrix.prep }} >/dev/null
            sh /install.sh
            export PATH="$HOME/.local/bin:$PATH"
            treemand version
            test -f "$HOME/.local/share/man/man1/treemand.1"
            # Releases before the treemand.dev mirror (unsigned) via the documented fallback.
            TREEMAND_BASE_URL=https://github.com/aallbrig/treemand/releases/download \
              sh /install.sh --version v0.5.0 --dir /tmp/pinned --no-verify-signature
            /tmp/pinned/treemand version | grep -q v0.5.0'

  install-script-macos:
    name: install.sh on macOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install the latest release
        run: |
          sh www/treemand/static/install.sh
          "$HOME/.local/bin/treemand" version

