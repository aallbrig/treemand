name: Release

on:
  push:
    tags:
      - "v*"
  # Auto Release starts this on the tag it created (a GITHUB_TOKEN tag push
  # triggers nothing). Run it on a tag ref only: the signing identity is
  # release.yml@refs/tags/<tag>.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build & Release
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write # create the GitHub Release
      id-token: write # keyless cosign signing (GitHub OIDC -> Fulcio)
    defaults:
      run:
        working-directory: cli/treemand

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: cli/treemand/go.mod
          cache-dependency-path: cli/treemand/go.sum

      - name: Run tests
        run: go test ./...

      - name: Build multi-platform binaries
        env:
          VERSION: ${{ github.ref_name }}
          COMMIT: ${{ github.sha }}
        run: |
          BUILD_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          LDFLAGS="-s -w \
            -X github.com/aallbrig/treemand/cmd.Version=${VERSION} \
            -X github.com/aallbrig/treemand/cmd.Commit=${COMMIT} \
            -X github.com/aallbrig/treemand/cmd.BuildDate=${BUILD_DATE}"

          mkdir -p dist

          # Generate docs using a native linux/amd64 build first
          CGO_ENABLED=0 go build -ldflags="${LDFLAGS}" -o dist/treemand_linux_amd64 .
          ./dist/treemand_linux_amd64 gendocs --output-dir dist/docs

          for target in \
            "linux/amd64" "linux/arm64" \
            "darwin/amd64" "darwin/arm64" \
            "windows/amd64"; do
            GOOS=${target%%/*}
            GOARCH=${target##*/}
            ext=""
            [ "$GOOS" = "windows" ] && ext=".exe"
            outname="treemand_${GOOS}_${GOARCH}${ext}"
            CGO_ENABLED=0 GOOS=$GOOS GOARCH=$GOARCH \
              go build -ldflags="${LDFLAGS}" \
              -o dist/$outname .
            # Create archive (include man page for non-Windows)
            if [ "$GOOS" = "windows" ]; then
              (cd dist && zip ${outname%.exe}.zip $outname)
            else
              tar czf dist/treemand_${GOOS}_${GOARCH}.tar.gz \
                -C dist $outname \
                -C docs/man treemand.1
            fi
          done

          # Generate checksums
          (cd dist && sha256sum *.tar.gz *.zip 2>/dev/null > checksums.txt)
          cat dist/checksums.txt

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.4

      - name: Sign checksums.txt (keyless)
        run: cosign sign-blob --yes --bundle dist/checksums.txt.sigstore.json dist/checksums.txt

      # The identity install.sh pins; proving it here means no user sees a release it can't verify.
      - name: Verify the signature
        run: |
          cosign verify-blob \
            --bundle dist/checksums.txt.sigstore.json \
            --certificate-identity "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release.yml@${GITHUB_REF}" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            dist/checksums.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            cli/treemand/dist/*.tar.gz
            cli/treemand/dist/*.zip
            cli/treemand/dist/checksums.txt
            cli/treemand/dist/checksums.txt.sigstore.json
          generate_release_notes: true

  update-homebrew:
    name: Update Homebrew Tap
    runs-on: ubuntu-latest
    needs: release
    steps:
      - name: Download checksums from release
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          BASE="https://github.com/aallbrig/treemand/releases/download/${VERSION}"
          curl -sL "${BASE}/checksums.txt" -o checksums.txt
          cat checksums.txt

      - name: Parse checksums
        id: sums
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          get_sha() { grep "$1" checksums.txt | awk '{print $1}'; }
          echo "darwin_amd64=$(get_sha treemand_darwin_amd64.tar.gz)" >> $GITHUB_OUTPUT
          echo "darwin_arm64=$(get_sha treemand_darwin_arm64.tar.gz)" >> $GITHUB_OUTPUT
          echo "linux_amd64=$(get_sha  treemand_linux_amd64.tar.gz)"  >> $GITHUB_OUTPUT
          echo "linux_arm64=$(get_sha  treemand_linux_arm64.tar.gz)"  >> $GITHUB_OUTPUT
          echo "version=${VERSION#v}" >> $GITHUB_OUTPUT

      - name: Checkout homebrew-tap
        uses: actions/checkout@v4
        with:
          repository: aallbrig/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: homebrew-tap

      - name: Update formula
        env:
          VERSION: ${{ steps.sums.outputs.version }}
          SHA_DARWIN_AMD64: ${{ steps.sums.outputs.darwin_amd64 }}
          SHA_DARWIN_ARM64: ${{ steps.sums.outputs.darwin_arm64 }}
          SHA_LINUX_AMD64:  ${{ steps.sums.outputs.linux_amd64 }}
          SHA_LINUX_ARM64:  ${{ steps.sums.outputs.linux_arm64 }}
        run: |
          cat > homebrew-tap/Formula/treemand.rb << FORMULA
          class Treemand < Formula
            desc "Visualize and interact with any CLI tool's command hierarchy as a tree"
            homepage "https://treemand.dev"
            version "${VERSION}"
            license "MIT"

            on_macos do
              on_intel do
                url "https://github.com/aallbrig/treemand/releases/download/v${VERSION}/treemand_darwin_amd64.tar.gz"
                sha256 "${SHA_DARWIN_AMD64}"

                def install
                  bin.install "treemand_darwin_amd64" => "treemand"
                  man1.install "treemand.1"
                end
              end
              on_arm do
                url "https://github.com/aallbrig/treemand/releases/download/v${VERSION}/treemand_darwin_arm64.tar.gz"
                sha256 "${SHA_DARWIN_ARM64}"

                def install
                  bin.install "treemand_darwin_arm64" => "treemand"
                  man1.install "treemand.1"
                end
              end
            end

            on_linux do
              on_intel do
                url "https://github.com/aallbrig/treemand/releases/download/v${VERSION}/treemand_linux_amd64.tar.gz"
                sha256 "${SHA_LINUX_AMD64}"

                def install
                  bin.install "treemand_linux_amd64" => "treemand"
                  man1.install "treemand.1"
                end
              end
              on_arm do
                url "https://github.com/aallbrig/treemand/releases/download/v${VERSION}/treemand_linux_arm64.tar.gz"
                sha256 "${SHA_LINUX_ARM64}"

                def install
                  bin.install "treemand_linux_arm64" => "treemand"
                  man1.install "treemand.1"
                end
              end
            end

            test do
              assert_match version.to_s, shell_output("#{bin}/treemand version")
            end
          end
          FORMULA

      - name: Commit and push formula update
        env:
          VERSION: ${{ steps.sums.outputs.version }}
        run: |
          cd homebrew-tap
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/treemand.rb
          git commit -m "chore: update treemand formula to v${VERSION}"
          git push

  mirror:
    name: Mirror to treemand.dev
    runs-on: ubuntu-latest
    needs: release
    environment:
      name: production
      url: https://treemand.dev/releases/latest.txt
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1
          mask-aws-account-id: true

      - name: Download release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$GITHUB_REF_NAME" --dir dist \
            --pattern 'treemand_*.tar.gz' --pattern 'treemand_*.zip' --pattern 'checksums.txt*'

      - name: Mirror release
        run: bash scripts/infra/mirror_release.sh "$GITHUB_REF_NAME" dist

  deploy-site:
    name: Deploy treemand.dev
    needs: mirror
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/site.yml
    secrets: inherit
