name: Release

on:
  push:
    tags:
      - "v*"
  # Auto Release starts this on the tag it created (a GITHUB_TOKEN tag push
  # triggers nothing). Run it on a tag ref only: the signing identity is
  # release.yml@refs/tags/<tag>.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build & Release
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write # create the GitHub Release
      id-token: write # keyless cosign signing (GitHub OIDC -> Fulcio)
    defaults:
      run:
        working-directory: cli/treemand

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # GoReleaser reads the previous tag

      - uses: actions/setup-go@v7
        with:
          go-version-file: cli/treemand/go.mod
          cache-dependency-path: cli/treemand/go.sum

      - name: Run tests
        run: go test ./...

      - name: Install syft (SBOMs)
        id: syft
        uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          syft-version: v1.56.0

      - name: Put syft on PATH
        env:
          SYFT: ${{ steps.syft.outputs.cmd }}
        run: dirname "$SYFT" >>"$GITHUB_PATH"

      - name: Install cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: v3.1.4

      # Builds, archives, Linux packages, SBOMs, checksums.txt, its keyless
      # signature and a draft GitHub Release: cli/treemand/.goreleaser.yaml.
      - name: Build, sign and publish with GoReleaser
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: v2.19.0
          args: release --clean
          workdir: cli/treemand
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # The identity install.sh pins; proving it here means no user sees a release it can't verify.
      - name: Verify the signature
        run: |
          cosign verify-blob \
            --bundle dist/checksums.txt.sigstore.json \
            --certificate-identity "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release.yml@${GITHUB_REF}" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            dist/checksums.txt

      # GoReleaser leaves the release as a draft; publish it once verified.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false --latest

  update-homebrew:
    name: Update Homebrew Tap
    runs-on: ubuntu-latest
    needs: release
    steps:
      - name: Download checksums from release
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          BASE="https://github.com/aallbrig/treemand/releases/download/${VERSION}"
          curl -sL "${BASE}/checksums.txt" -o checksums.txt
          cat checksums.txt

      - name: Parse checksums
        id: sums
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          get_sha() { grep "$1" checksums.txt | awk '{print $1}'; }
          echo "darwin_amd64=$(get_sha treemand_darwin_amd64.tar.gz)" >> $GITHUB_OUTPUT
          echo "darwin_arm64=$(get_sha treemand_darwin_arm64.tar.gz)" >> $GITHUB_OUTPUT
          echo "linux_amd64=$(get_sha  treemand_linux_amd64.tar.gz)"  >> $GITHUB_OUTPUT
          echo "linux_arm64=$(get_sha  treemand_linux_arm64.tar.gz)"  >> $GITHUB_OUTPUT
          echo "version=${VERSION#v}" >> $GITHUB_OUTPUT

      - name: Checkout homebrew-tap
        uses: actions/checkout@v7
        with:
          repository: aallbrig/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: homebrew-tap

      - name: Update formula
        env:
          VERSION: ${{ steps.sums.outputs.version }}
          SHA_DARWIN_AMD64: ${{ steps.sums.outputs.darwin_amd64 }}
          SHA_DARWIN_ARM64: ${{ steps.sums.outputs.darwin_arm64 }}
          SHA_LINUX_AMD64:  ${{ steps.sums.outputs.linux_amd64 }}
          SHA_LINUX_ARM64:  ${{ steps.sums.outputs.linux_arm64 }}
        run: |
          cat > homebrew-tap/Formula/treemand.rb << FORMULA
          class Treemand < Formula
            desc "Visualize and interact with any CLI tool's command hierarchy as a tree"
            homepage "https://treemand.dev"
            version "${VERSION}"
            license "MIT"

            on_macos do
              on_intel do
                url "https://github.com/aallbrig/treemand/releases/download/v${VERSION}/treemand_darwin_amd64.tar.gz"
                sha256 "${SHA_DARWIN_AMD64}"

                def install
                  bin.install "treemand_darwin_amd64" => "treemand"
                  man1.install "treemand.1"
                end
              end
              on_arm do
                url "https://github.com/aallbrig/treemand/releases/download/v${VERSION}/treemand_darwin_arm64.tar.gz"
                sha256 "${SHA_DARWIN_ARM64}"

                def install
                  bin.install "treemand_darwin_arm64" => "treemand"
                  man1.install "treemand.1"
                end
              end
            end

            on_linux do
              on_intel do
                url "https://github.com/aallbrig/treemand/releases/download/v${VERSION}/treemand_linux_amd64.tar.gz"
                sha256 "${SHA_LINUX_AMD64}"

                def install
                  bin.install "treemand_linux_amd64" => "treemand"
                  man1.install "treemand.1"
                end
              end
              on_arm do
                url "https://github.com/aallbrig/treemand/releases/download/v${VERSION}/treemand_linux_arm64.tar.gz"
                sha256 "${SHA_LINUX_ARM64}"

                def install
                  bin.install "treemand_linux_arm64" => "treemand"
                  man1.install "treemand.1"
                end
              end
            end

            test do
              assert_match version.to_s, shell_output("#{bin}/treemand version")
            end
          end
          FORMULA

      - name: Commit and push formula update
        env:
          VERSION: ${{ steps.sums.outputs.version }}
        run: |
          cd homebrew-tap
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/treemand.rb
          git commit -m "chore: update treemand formula to v${VERSION}"
          git push

  mirror:
    name: Mirror to treemand.dev
    runs-on: ubuntu-latest
    needs: release
    environment:
      name: production
      url: https://treemand.dev/releases/latest.txt
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1
          mask-aws-account-id: true

      - name: Download release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$GITHUB_REF_NAME" --dir dist \
            --pattern 'treemand_*.tar.gz' --pattern 'treemand_*.zip' --pattern 'checksums.txt*'

      - name: Mirror release
        run: bash scripts/infra/mirror_release.sh "$GITHUB_REF_NAME" dist

  deploy-site:
    name: Deploy treemand.dev
    needs: mirror
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/site.yml
    secrets: inherit
