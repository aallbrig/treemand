name: Deploy Pages

on:
  push:
    branches: [main]
    paths:
      - "www/treemand/**"
      - "cli/treemand/**"
      - "scripts/gen-web-trees.sh"
  workflow_run:
    workflows: ["Demo Video"]
    types: [completed]
    branches: [main]

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "0.157.0"
          extended: true

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: cli/treemand/go.mod

      - name: Build in-browser TUI (wasm)
        run: cli/treemand/web/wasm/build.sh www/treemand/static/try

      - name: Build
        working-directory: www/treemand
        run: hugo --minify --baseURL "https://aallbrig.github.io/treemand/"

      - name: Deploy
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: www/treemand/public
