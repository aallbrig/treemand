name: Deploy Site

# Deploys infra/site.yaml and publishes the Hugo site to https://treemand.dev.
# Runs on site-affecting pushes to main, after the demo video is re-recorded,
# on demand, and from the Release workflow (workflow_call).
#
# AWS access is the treemand-deploy role through GitHub OIDC; its trust policy
# only accepts jobs in the "production" environment (branch main, tags v*).
# Role ARNs are environment secrets, and account-derived values are masked.

on:
  push:
    branches: [main]
    paths:
      - "www/treemand/**"
      - "cli/treemand/**"
      - "infra/site.yaml"
      - "scripts/infra/**"
      - "scripts/gen-web-trees.sh"
      - ".github/workflows/site.yml"
  workflow_run:
    workflows: ["Demo Video"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-site
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy treemand.dev
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://treemand.dev
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: cli/treemand/go.mod
          cache-dependency-path: cli/treemand/go.sum

      - uses: peaceiris/actions-hugo@d1c81a15d4e6dca7086a17b9c2565cb70fd576bf # v3.3.0
        with:
          hugo-version: "0.157.0"
          extended: true

      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1
          mask-aws-account-id: true

      - name: Deploy site stack
        env:
          AWS_CFN_EXEC_ROLE_ARN: ${{ secrets.AWS_CFN_EXEC_ROLE_ARN }}
        run: bash scripts/infra/deploy_site.sh

      - name: Publish site
        run: bash scripts/infra/publish_site.sh
