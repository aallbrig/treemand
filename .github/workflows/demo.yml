name: Demo Video

on:
  push:
    branches: [main]
    paths:
      - 'cli/**'
      - 'demos/**'
      - 'scripts/record-demo.sh'
      - 'scripts/record-subcmd-gifs.sh'
      - 'Makefile'
      - 'Taskfile.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  record:
    runs-on: ubuntu-latest
    permissions:
      contents: write # commit the recorded demo

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: cli/treemand/go.mod
          cache-dependency-path: cli/treemand/go.sum

      - name: Build and install treemand
        run: make install

      - name: Install demo dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg
          curl -fsSL https://github.com/tsl0922/ttyd/releases/latest/download/ttyd.x86_64 -o /tmp/ttyd
          sudo install /tmp/ttyd /usr/local/bin/ttyd
          go install github.com/charmbracelet/vhs@latest

      - name: Record full demo video
        run: bash scripts/record-demo.sh

      - name: Record per-subcommand GIFs
        run: bash scripts/record-subcmd-gifs.sh

      - name: Upload demo video
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: demo-video
          path: dist/demo.mp4
          retention-days: 90

      - name: Commit subcmd GIFs to repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add www/treemand/static/demos/
          git diff --staged --quiet || git commit -m "chore: update subcmd demo GIFs"
          git push
