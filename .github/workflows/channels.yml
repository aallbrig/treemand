name: Install channels

# Fails when a documented install channel lags the latest release by more than
# one version, or when the site documents a channel that is not published (#45).

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_run:
    workflows: ["Publish to Package Managers"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  channels:
    name: Documented channels are current
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check channels
        run: sh scripts/channels_check.sh
