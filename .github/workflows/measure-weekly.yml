name: Measure (weekly)

# Heavy measurements that are too slow for every PR. The findings are uploaded
# for the interpretation step (treemand-measure, run by treemand-product-audit
# or a scheduled session), which files issues and records history.

on:
  schedule:
    - cron: "41 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  actions: read # release-health and ci-health read workflow runs

jobs:
  measure:
    name: Heavy probes
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: cli/treemand/go.mod
          cache-dependency-path: cli/treemand/go.sum
      - name: zoo (sweep + smoke)
        run: python3 -I scripts/metrics/measure.py zoo --findings | tee zoo.json
      - name: dependency-health
        # setup-go above installs go.mod's toolchain, so govulncheck judges the
        # standard library treemand is built with.
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          PATH="$(go env GOPATH)/bin:$PATH" python3 -I scripts/metrics/measure.py dependency-health --findings >dependency-health.json
      - name: test-effectiveness
        # Mutation testing is too slow for every PR (about ten minutes). The
        # discovery tests mostly wait on fake CLIs, so four workers fit four CPUs.
        env:
          TEST_EFFECTIVENESS_WORKERS: "4"
        run: |
          go install github.com/go-gremlins/gremlins/cmd/gremlins@v0.6.0
          PATH="$(go env GOPATH)/bin:$PATH" python3 -I scripts/metrics/measure.py test-effectiveness --findings >test-effectiveness.json
      - name: complexity, parser, tui, tui-layout, tui-keymap, tui-contrast
        run: |
          for p in complexity parser tui tui-layout tui-keymap tui-contrast; do
            python3 -I scripts/metrics/measure.py "$p" --findings >"$p.json"
          done
      - name: Install cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: v3.1.4
      - name: release-health
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -I scripts/metrics/measure.py release-health --findings >release-health.json
      - name: ci-health (GitHub Actions API)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: python3 -I scripts/metrics/measure.py ci-health --findings >ci-health.json
      - name: fuzz (60s per target)
        # Crashers are left in cli/treemand/**/testdata/fuzz/ and uploaded below
        # with the findings; the interpretation step files them (treemand-fuzz-campaign).
        env:
          FUZZ_SECONDS: "60"
        run: python3 -I scripts/metrics/measure.py fuzz --findings >fuzz.json
      - name: adoption-signals (GitHub API, module proxy)
        # The workflow token cannot read traffic (it needs push access), so
        # views, clones and referrers are skipped here; a maintainer run records them.
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: python3 -I scripts/metrics/measure.py adoption-signals --findings >adoption-signals.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: measurements
          path: |
            *.json
            cli/treemand/**/testdata/fuzz/**
