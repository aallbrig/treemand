version: "2"
run:
  modules-download-mode: readonly
linters:
  enable:
    - gosec
    - misspell
    - revive
    # Bug finders: each flagged something real when adopted (see PR).
    - errorlint    # type assertions on errors miss wrapped errors
    - nilerr       # returning nil while holding a non-nil error
    - wastedassign
    - bodyclose
    - unconvert
    - copyloopvar
    - errname
    - gocritic
    - nolintlint   # every //nolint must still be needed
  disable:
    - depguard
  settings:
    gocritic:
      disabled-checks:
        - ifElseChain # style only
    gosec:
      excludes:
        - G304
        - G204
    revive:
      rules:
        - name: exported
          disabled: false
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - linters:
          - errcheck
          - gosec
        path: _test\.go
    paths:
      - third_party$
      - builtin$
      - examples$
formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/aallbrig/treemand
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
