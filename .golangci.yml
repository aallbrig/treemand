version: "2"
run:
  modules-download-mode: readonly
# Show every finding, not the first three of each kind.
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
linters:
  enable:
    - gosec
    - misspell
    - revive
    # Bug finders: each flagged something real when adopted (see PR).
    - errorlint    # type assertions on errors miss wrapped errors
    - nilerr       # returning nil while holding a non-nil error
    - wastedassign
    - bodyclose
    - unconvert
    - copyloopvar
    - errname
    - gocritic
    - nolintlint   # every //nolint must still be needed
    - depguard     # package import layering (#476); tested by scripts/dev/layering_test.sh
  settings:
    # Layers, lowest first; a package imports only from layers below it:
    #   models, config, history, savedpresets   (leaves)
    #   discovery, fuzzy, render
    #   presets, overrides, cache
    #   mcp, tui
    #   cmd
    # Only cmd and the tools/ binaries import tui; only main imports cmd.
    depguard:
      rules:
        leaves:
          files:
            - "**/cli/treemand/models/**"
            - "**/cli/treemand/config/**"
            - "**/cli/treemand/history/**"
            - "**/cli/treemand/savedpresets/**"
          deny:
            - {pkg: github.com/aallbrig/treemand/cli/treemand/discovery, desc: "leaf packages import nothing above them"}
            - {pkg: github.com/aallbrig/treemand/cli/treemand/fuzzy, desc: "leaf packages import nothing above them"}
            - {pkg: github.com/aallbrig/treemand/cli/treemand/render, desc: "leaf packages import nothing above them"}
            - {pkg: github.com/aallbrig/treemand/cli/treemand/presets, desc: "leaf packages import nothing above them"}
            - {pkg: github.com/aallbrig/treemand/cli/treemand/overrides, desc: "leaf packages import nothing above them"}
            - {pkg: github.com/aallbrig/treemand/cli/treemand/cache, desc: "leaf packages import nothing above them"}
            - {pkg: github.com/aallbrig/treemand/cli/treemand/mcp, desc: "leaf packages import nothing above them"}
        discovery:
          files:
            - "**/cli/treemand/discovery/**"
          deny:
            - {pkg: github.com/aallbrig/treemand/cli/treemand/presets, desc: "discovery imports nothing above it; callers pass a preset's hints in"}
            - {pkg: github.com/aallbrig/treemand/cli/treemand/overrides, desc: "discovery imports nothing above it"}
            - {pkg: github.com/aallbrig/treemand/cli/treemand/cache, desc: "discovery imports nothing above it"}
            - {pkg: github.com/aallbrig/treemand/cli/treemand/mcp, desc: "discovery imports nothing above it"}
        middle:
          files:
            - "**/cli/treemand/fuzzy/**"
            - "**/cli/treemand/render/**"
          deny:
            - {pkg: github.com/aallbrig/treemand/cli/treemand/presets, desc: "fuzzy and render import nothing above them"}
            - {pkg: github.com/aallbrig/treemand/cli/treemand/overrides, desc: "fuzzy and render import nothing above them"}
            - {pkg: github.com/aallbrig/treemand/cli/treemand/cache, desc: "fuzzy and render import nothing above them"}
            - {pkg: github.com/aallbrig/treemand/cli/treemand/mcp, desc: "fuzzy and render import nothing above them"}
        stores:
          files:
            - "**/cli/treemand/presets/**"
            - "**/cli/treemand/overrides/**"
            - "**/cli/treemand/cache/**"
          deny:
            - {pkg: github.com/aallbrig/treemand/cli/treemand/mcp, desc: "presets, overrides and cache stay below the front ends"}
        tui:
          files:
            - "**/cli/treemand/tui/**"
          deny:
            - {pkg: github.com/aallbrig/treemand/cli/treemand/mcp, desc: "tui and mcp are separate front ends"}
        not-tui:
          files:
            - "$all"
            - "!**/cli/treemand/tui/**"
            - "!**/cli/treemand/cmd/**"
            - "!**/cli/treemand/tools/**"
          deny:
            - {pkg: github.com/aallbrig/treemand/cli/treemand/tui, desc: "only cmd and the tools/ binaries import tui"}
        not-cmd:
          files:
            - "$all"
            - "!**/cli/treemand/cmd/**"
            - "!**/cli/treemand/main.go"
          deny:
            - {pkg: github.com/aallbrig/treemand/cli/treemand/cmd, desc: "only main imports cmd"}
    gocritic:
      enabled-checks:
        - ruleguard
      disabled-checks:
        - ifElseChain # style only
      settings:
        ruleguard:
          # wallClockBound: no wall-clock asserts in unit tests (#477).
          rules: "${base-path}/cli/treemand/lintrules/*.go"
          failOn: all
    gosec:
      excludes:
        - G304
        - G204
    revive:
      rules:
        - name: exported
          disabled: false
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - linters:
          - errcheck
          - gosec
        path: _test\.go
    paths:
      - third_party$
      - builtin$
      - examples$
formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/aallbrig/treemand
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
