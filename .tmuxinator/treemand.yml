# yaml-language-server: $schema=https://json.schemastore.org/tmuxinator.json
name: treemand
root: <%= ENV["TREEMAND_ROOT"] || Dir.pwd %>
enable_pane_titles: true
startup_window: dev

windows:
  - dev:
      layout: tiled
      panes:
        - dev:
            - clear
        - tui:
            - 'echo "ad-hoc pane - try: task build && ./treemand -i git"'

  - watch:
      layout: tiled
      panes:
        - dev:
            - clear
        - fmt:
            - watchexec -e go --watch cli/treemand --restart -- bash -c 'task fmt && echo "[format] done"'
        - test:
            - watchexec -e go --watch cli/treemand --restart -- bash -c 'task test && echo "[test] done"'
        - lint:
            - watchexec -e go --watch cli/treemand --restart -- bash -c 'task lint && echo "[lint] done"'

  - sites:
      layout: tiled
      panes:
        - dev:
            - clear
        - hugo:
            - task site:dev

  - loops:
      layout: tiled
      panes:
        - dev:
            - task loop:status
        - agent:
            - task loop:agent
