# yaml-language-server: $schema=https://json.schemastore.org/tmuxinator.json
# The treemand_dev session. The loops window holds a dev shell: the agent pane is
# created by `task loop:start` (scripts/loop/loopctl.sh) and closes when the loop
# stops. When the session starts (e.g. at login) `task loop:resume` brings the
# agent pane back only if the loop is enabled (.loop/ENABLED in its home worktree).
name: <%= ENV["TREEMAND_SESSION"] || "treemand_dev" %>
root: <%= ENV["TREEMAND_ROOT"] || Dir.pwd %>
enable_pane_titles: true
startup_window: dev

windows:
  - bootstrap:
      panes:
        - bootstrap:
            - sh scripts/dev/bootstrap.sh

  - dev:
      layout: tiled
      panes:
        - dev:
            - clear
        - tui:
            - 'echo "ad-hoc pane - try: task build && ./treemand -i git"'

  - watch:
      layout: tiled
      panes:
        - dev:
            - clear
        - fmt:
            - watchexec -e go --watch cli/treemand --restart -- bash -c 'task fmt && echo "[format] done"'
        - test:
            - watchexec -e go --watch cli/treemand --restart -- bash -c 'task test && echo "[test] done"'
        - lint:
            - watchexec -e go --watch cli/treemand --restart -- bash -c 'task lint && echo "[lint] done"'

  - site:
      layout: tiled
      panes:
        - dev:
            - clear
        - hugo:
            - task site:dev

  # Read-only production status, each pane refreshing every PROD_REFRESH_SECONDS
  # (default 300). AWS uses AWS_PROFILE; without access it shows a hint.
  - prod:
      layout: tiled
      panes:
        - site:
            - sh scripts/prod/site.sh
        - pipelines:
            - sh scripts/prod/pipelines.sh
        - aws:
            - sh scripts/prod/aws.sh
        - downloads:
            - sh scripts/prod/downloads.sh

  - loops:
      panes:
        - dev:
            - task loop:resume
            - task loop:status
