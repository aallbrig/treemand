baseURL = "https://treemand.dev/"
languageCode = "en-us"
title = "Treemand"
theme = "minimal"

# Tag and category pages are never used and have no h1 or content.
disableKinds = ["taxonomy", "term"]

[markup]
  # Classes, not inline colours, so code follows the light/dark theme;
  # themes/minimal/static/css/chroma.css holds GitHub light and dark.
  [markup.highlight]
    noClasses = false
  # The docs pages' "On this page" outline: sections and subsections.
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 3
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

[params]
  description = "treemand maps any command-line tool's subcommands, flags and arguments into a tree you can browse in your terminal or browser, then build a command and copy or run it."
  homeTitle = "treemand: explore any CLI as a command tree"
  author = "aallbrig"
  # Absolute origin for canonical and social-card URLs.
  origin = "https://treemand.dev"
  socialImage = "social-card.png"

[menu]
  [[menu.main]]
    identifier = "try"
    name = "Try it"
    url = "/try/"
    weight = 2
  [[menu.main]]
    identifier = "getting-started"
    name = "Getting started"
    url = "/getting-started/"
    weight = 4
  [[menu.main]]
    identifier = "reference"
    name = "Reference"
    url = "/reference/"
    weight = 5
  [[menu.main]]
    identifier = "commands"
    name = "Commands"
    url = "/commands/"
    weight = 6

# The home page reads the corpus ground truth so its "tested against N CLIs"
# count is the real one, never typed in.
[module]
  [[module.mounts]]
    source = "data"
    target = "data"
  [[module.mounts]]
    source = "../../cli/treemand/discovery/testdata/corpus"
    target = "data/corpus"
    includeFiles = "expect.json"

# /llms.txt (a map of the docs for LLM agents, https://llmstxt.org) and
# /llms-full.txt (every docs page's Markdown in one file), both generated
# from the page list so they never go stale.
[outputFormats]
  [outputFormats.llms]
    mediaType = "text/plain"
    baseName = "llms"
    isPlainText = true
    notAlternative = true
  [outputFormats.llmsfull]
    mediaType = "text/plain"
    baseName = "llms-full"
    isPlainText = true
    notAlternative = true

[outputs]
  home = ["HTML", "RSS", "llms", "llmsfull"]
