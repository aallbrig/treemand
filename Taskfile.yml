---
# yaml-language-server: $schema=https://taskfile.dev/schema.json

version: "3"

vars:
  MODULE: github.com/aallbrig/treemand/cmd
  COMMIT:
    sh: git rev-parse --short HEAD 2>/dev/null || echo unknown
  DATE:
    sh: date -u +%Y-%m-%d
  VERSION:
    sh: git describe --tags --always --dirty 2>/dev/null || echo dev
  LDFLAGS: >-
    -X '{{.MODULE}}.Version={{.VERSION}}'
    -X '{{.MODULE}}.Commit={{.COMMIT}}'
    -X '{{.MODULE}}.BuildDate={{.DATE}}'
  GO_PKGS: ./cli/treemand/...

tasks:
  default:
    desc: List available tasks
    cmds:
      - task --list

  # ── build ────────────────────────────────────────────────────────────────

  build:
    desc: Build the treemand binary
    cmds:
      - go build -ldflags "{{.LDFLAGS}}" -o treemand ./cli/treemand

  install:
    desc: Install treemand into GOPATH/bin
    cmds:
      - go install -ldflags "{{.LDFLAGS}}" ./cli/treemand

  # ── hygiene ──────────────────────────────────────────────────────────────

  fmt:
    desc: Format Go source files with gofmt
    cmds:
      - gofmt -w ./cli/treemand

  lint:
    desc: Run golangci-lint
    cmds:
      - golangci-lint run {{.GO_PKGS}}

  lint-fix:
    desc: Run golangci-lint with auto-fix enabled
    cmds:
      - golangci-lint run --fix {{.GO_PKGS}}

  vet:
    desc: Run go vet
    cmds:
      - go vet {{.GO_PKGS}}

  vuln:
    desc: Run govulncheck for known vulnerabilities
    dir: cli/treemand
    cmds:
      - govulncheck ./...

  secrets:
    desc: Scan staged changes for secrets and AWS account identifiers (.gitleaks.toml)
    cmds:
      - gitleaks git --staged --config .gitleaks.toml --redact --no-banner --log-level warn .

  secrets:history:
    desc: Scan all of git history for secrets and AWS account identifiers
    cmds:
      - gitleaks git --config .gitleaks.toml --redact --no-banner --log-level warn .

  py:lint:
    desc: Lint and format-check the repo's Python (ruff, rules and file list in pyproject.toml)
    cmds:
      - ruff check
      - ruff format --check

  py:types:
    desc: Type-check the repo's Python with mypy --strict (file list in pyproject.toml)
    cmds:
      - mypy --strict

  infra:lint:
    desc: cfn-lint (with the Project=treemand tag rule) and checkov over infra/*.yaml
    cmds:
      - bash scripts/infra_lint.sh

  infra:bootstrap:
    desc: Deploy the bootstrap stack (admin credentials) and wire the GitHub production environment
    cmds:
      - bash scripts/infra/bootstrap.sh

  infra:deploy:
    desc: Deploy the site stack (S3, CloudFront, DNS, logs) through the treemand-cfn-exec service role
    cmds:
      - bash scripts/infra/deploy_site.sh

  site:publish:
    desc: Build the site for https://treemand.dev, sync it to S3 (releases/ untouched) and invalidate the CDN
    cmds:
      - bash scripts/infra/publish_site.sh

  metrics:downloads:
    desc: "treemand.dev usage from CloudFront logs via Athena: task metrics:downloads -- [days]"
    cmds:
      - bash scripts/infra/metrics_downloads.sh {{.CLI_ARGS}}

  zoo:build:
    desc: Build the cli-zoo image (pinned CLIs from help-text families this machine may lack)
    cmds:
      - docker build -t treemand-cli-zoo -f test/cli-zoo/Dockerfile .

  zoo:smoke:
    desc: Full discovery of every cli-zoo CLI inside the container; fails on a crash, error or empty tree
    deps: [zoo:build]
    cmds:
      - docker run --rm treemand-cli-zoo smoke

  zoo:capture:
    desc: Refresh the corpus fixtures of the cli-zoo CLIs from the container (review the diff)
    deps: [zoo:build]
    cmds:
      - docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp -v "$PWD/cli/treemand/discovery/testdata/corpus:/out/corpus" treemand-cli-zoo capture

  ab:
    desc: "Full discovery of real CLIs, origin/main vs this tree, with a side-effect audit: task ab -- [--base REF] <cli>..."
    cmds:
      - bash scripts/real_cli_ab.sh {{.CLI_ARGS}}

  corpus:show:
    desc: "What the parser extracts from corpus fixtures: task corpus:show -- <cli>..."
    dir: cli/treemand
    cmds:
      - go run ./tools/corpusdump discovery/testdata/corpus {{.CLI_ARGS}}

  corpus:diff:
    desc: "Every subcommand, flag and description the parser gains or loses on the corpus vs a ref: task corpus:diff -- [ref]"
    cmds:
      - bash scripts/corpus_diff.sh {{.CLI_ARGS}}

  ship:start:
    desc: "Start work on a branch from a freshly fetched origin/main: task ship:start -- <branch>"
    cmds:
      - bash scripts/ship.sh start {{.CLI_ARGS}}

  ship:pr:
    desc: "Commit what is staged, push, open the PR and merge it, stopping at the first failure: task ship:pr -- --subject S --title T --body FILE [--trailer K:V]..."
    cmds:
      - bash scripts/ship.sh pr {{.CLI_ARGS}}

  measure:
    desc: "Run a measurement probe and judge it against its rules: task measure -- <probe> [--record] [--gate] [--findings]"
    cmds:
      - python3 -I scripts/metrics/measure.py {{.CLI_ARGS}}

  measure:pull:
    desc: Record the latest CI timing run (tui, perf) into docs/metrics under the runner's host name
    cmds:
      - bash scripts/metrics/pull_ci.sh

  measure:list:
    desc: List the measurement probes
    cmds:
      - python3 -I scripts/metrics/measure.py --list

  measure:test:
    desc: Test the measurement engine (budgets, ratchets, history, gate)
    cmds:
      - bash scripts/metrics/measure_test.sh

  channels:check:
    desc: Check every documented install channel is published and current (network)
    cmds:
      - bash scripts/channels_check.sh

  channels:test:
    desc: Test the install-channel check offline
    cmds:
      - bash scripts/channels_check_test.sh

  release:test:
    desc: Test the release planner (which merged PRs ask for which release) and lint the release scripts as POSIX sh
    cmds:
      - shellcheck --shell=sh -x scripts/release/lib.sh scripts/release/plan.sh scripts/release/plan_test.sh scripts/release/lib_test.sh scripts/release/dispatch.sh scripts/release/wait.sh
      - sh scripts/release/plan_test.sh
      - sh scripts/release/lib_test.sh

  gates:test:
    desc: Prove the account-identifier and Project-tag gates fire on fixtures
    cmds:
      - bash scripts/gates_test.sh

  # ── tests ────────────────────────────────────────────────────────────────

  test:
    desc: Run all tests
    cmds:
      - go test {{.GO_PKGS}}

  test-race:
    desc: Run all tests with race detector
    cmds:
      - go test -race {{.GO_PKGS}}

  # ── composite ────────────────────────────────────────────────────────────

  hygiene:
    desc: Run all code hygiene tasks (fmt, vet, lint, vuln)
    cmds:
      - task: fmt
      - task: vet
      - task: lint
      - task: vuln

  fix:
    desc: Auto-fix everything that can be fixed (fmt + lint --fix)
    cmds:
      - task: fmt
      - task: lint-fix

  precommit:
    desc: Pre-commit gate — secrets, infra lint, fmt check, vet, lint, vuln, tests with coverage floors
    cmds:
      - task: secrets
      - task: infra:lint
      # Check, don't rewrite: a rewrite after staging commits the unformatted
      # copy and fails CI's fmt:check (#178). Run `task fmt` and re-stage.
      - task: fmt:check
      - task: vet
      - task: lint
      - task: vuln
      # Runs every test once, with coverage, and fails below a package's floor:
      # the floor failures CI used to find after the push are caught here.
      - task: coverage:check

  dev:install:
    desc: Fast edit loop — test then install the binary
    cmds:
      - task: test
      - task: install

  # ── dev session (tmuxinator) ─────────────────────────────────────────────

  dev:
    desc: Start the treemand_dev tmuxinator session, or attach if it is already running
    cmds:
      - sh scripts/dev_session.sh up

  dev:attach:
    desc: Re-attach to the running dev session without restarting it
    cmds:
      - sh scripts/dev_session.sh attach

  dev:recycle:
    desc: Kill and restart the dev session (works from outside tmux)
    cmds:
      - sh scripts/dev_session.sh recycle

  dev:stop:
    desc: Stop the dev session and everything running in it
    cmds:
      - sh scripts/dev_session.sh stop

  dev:check:
    desc: Validate the tmuxinator config without starting anything
    cmds:
      - tmuxinator debug --project-config .tmuxinator/treemand.yml >/dev/null

  dev:bootstrap:
    desc: Host readiness report (tools task ci needs, with install hints), then open the local and production sites
    cmds:
      - sh scripts/dev/bootstrap.sh

  dev:test:
    desc: Behaviour tests for the dev-host scripts (bootstrap report, setup with stubbed installers, git hook chain, autostart units)
    cmds:
      - sh scripts/dev/bootstrap_test.sh
      - sh scripts/dev/setup_test.sh
      - sh scripts/dev/hooks_test.sh
      - sh scripts/dev/autostart_test.sh

  autostart:install:
    desc: Start the dev session at login (launchd LaunchAgent on macOS, systemd --user unit on Linux); the loop resumes only if enabled
    cmds:
      - sh scripts/dev/autostart.sh install

  autostart:uninstall:
    desc: Stop starting the dev session at login and remove every file autostart:install wrote
    cmds:
      - sh scripts/dev/autostart.sh uninstall

  autostart:status:
    desc: Show whether login autostart is installed and loaded
    cmds:
      - sh scripts/dev/autostart.sh status

  # ── dev loop ─────────────────────────────────────────────────────────────

  loop:start:
    desc: Enable and start the autonomous dev loop (creates the home worktree, the session and the loops agent pane if needed); runs until loop:stop
    cmds:
      - sh scripts/loop/loopctl.sh start

  loop:stop:
    desc: "Disable the dev loop; the cycle in flight ends at its next phase boundary (add -- --now to kill the agent immediately)"
    cmds:
      - sh scripts/loop/loopctl.sh stop {{.CLI_ARGS}}

  loop:resume:
    desc: Start the loop's supervisor only if the loop is enabled (run by the loops window when the session starts)
    cmds:
      - sh scripts/loop/loopctl.sh resume

  loop:status:
    desc: Show loop state, caps, failure streak and whether the supervisor runs
    cmds:
      - sh scripts/loop/loopctl.sh status

  loop:attach:
    desc: Attach to the loops window of the dev session
    cmds:
      - sh scripts/loop/loopctl.sh attach

  loop:agent:
    desc: Run the loop supervisor and its Remote Control session (run by the agent pane that loop:start creates)
    cmds:
      - sh scripts/loop/supervisor.sh

  loop:labels:
    desc: Create the GitHub labels the loop uses (idempotent)
    cmds:
      - bash scripts/loop/bootstrap-labels.sh

  loop:check:
    desc: Static checks for the loop machinery (shellcheck, state script, guard and session hooks, skill present)
    cmds:
      - shellcheck -x -S warning scripts/loop/*.sh scripts/loop/hooks/*.sh scripts/dev_session.sh scripts/dev/*.sh scripts/pr_merge.sh scripts/check_*.sh scripts/install_test.sh scripts/site_audit.sh scripts/site_search_index.sh scripts/make_site_assets.sh www/treemand/static/install.sh scripts/infra/*.sh scripts/gates_test.sh scripts/infra_lint.sh scripts/real_cli_ab.sh scripts/corpus_diff.sh scripts/ship.sh scripts/metrics/*.sh scripts/channels_check*.sh
      - python3 -I scripts/loop/state.py summary >/dev/null
      - bash scripts/loop/guard_test.sh
      - sh scripts/loop/hooks/hooks_test.sh
      - test -f .claude/skills/treemand-loop/SKILL.md
      - test -f .claude/skills/treemand-product-audit/SKILL.md

  visual:check:
    desc: Capture the TUI and the site (desktop + mobile) into .loop/shots/ for review
    cmds:
      - bash scripts/loop/visual-check.sh

  corpus:
    desc: Run treemand against real CLIs on this machine and print quality metrics (TSV)
    cmds:
      - bash scripts/loop/corpus.sh {{.CLI_ARGS}}

  e2e:
    desc: End-to-end tests of the built binary against fake CLIs (cobra, argparse, clap styles) and a pty
    cmds:
      - go test -count=1 -v ./cli/treemand/e2e

  install:test:
    desc: Test www/treemand/static/install.sh against a local fake release (checksums, versions, platforms, privileges) and that the docs agree with it
    cmds:
      - bash scripts/install_test.sh

  corpus:test:
    desc: Parse the committed help fixtures and fail if any metric regressed against the baseline
    cmds:
      - go test -count=1 -run TestCorpus ./cli/treemand/discovery

  corpus:update-baseline:
    desc: Deliberately rewrite the corpus baseline from current parser output (review the diff)
    cmds:
      - go test -count=1 -run TestCorpus_noRegressionAgainstBaseline ./cli/treemand/discovery -update

  corpus:capture:
    desc: "Re-capture help fixtures from CLIs installed here: task corpus:capture -- [cli...]"
    cmds:
      - bash scripts/capture_corpus.sh {{.CLI_ARGS}}

  coverage:
    desc: Per-package Go test coverage
    dir: cli/treemand
    cmds:
      - go test -cover ./...

  coverage:check:
    desc: Fail if any package is below its floor in scripts/coverage_floor.tsv
    cmds:
      - bash scripts/check_coverage.sh

  coverage:update-floor:
    desc: Deliberately ratchet the coverage floors to today's coverage (review the diff)
    cmds:
      - bash scripts/check_coverage.sh --update

  fuzz:
    desc: "Fuzz a help parser for a while: task fuzz -- FuzzParseHelpOutput 60s"
    dir: cli/treemand
    cmds:
      - go test -run '^$' -fuzz={{index (splitList " " .CLI_ARGS) 0 | default "FuzzParseHelpOutput"}} -fuzztime={{index (splitList " " .CLI_ARGS) 1 | default "30s"}} ./discovery

  chaos:
    desc: Reliability suite - hostile fake CLIs must not hang, panic or exhaust memory
    cmds:
      - bash scripts/loop/chaos.sh

  perf:
    desc: Measure cold/warm time, memory and discovery quality on real CLIs (no files written)
    cmds:
      - python3 -I scripts/loop/perf.py measure

  perf:compare:
    desc: Measure and fail if any metric regressed against the last recorded version on this host
    cmds:
      - python3 -I scripts/loop/perf.py compare

  "perf:record":
    desc: "Append a measurement to docs/perf/history.tsv: task perf:record -- --version v0.4.0"
    cmds:
      - python3 -I scripts/loop/perf.py record {{.CLI_ARGS}}

  perf:show:
    desc: Performance and quality trend per CLI across recorded releases
    cmds:
      - python3 -I scripts/loop/perf.py show

  loop:test-session:
    desc: Exercise the dev session, loop control and the supervisor on isolated tmux servers with fake gh and claude
    cmds:
      - sh scripts/loop/session_test.sh
      - sh scripts/loop/supervisor_test.sh

  doctor:
    desc: Show what else is running on this machine before touching real infrastructure
    cmds:
      - tmux ls 2>/dev/null || echo "no tmux sessions"
      - (lsof -nP -iTCP -sTCP:LISTEN 2>/dev/null || ss -ltnp 2>/dev/null) | grep -E ':(1313|18080)\b' || echo "dev ports free"
      - git worktree list
      - sh scripts/loop/loopctl.sh status

  # ── composite gates ──────────────────────────────────────────────────────

  setup:
    desc: "Dev host setup (macOS or Linux): report tools and git hooks, changing nothing; task setup -- --install installs what is missing"
    cmds:
      - sh scripts/dev/setup.sh {{.CLI_ARGS}}

  format:
    desc: Format everything
    cmds:
      - task: fmt

  ci:
    desc: All quality gates; needs no live services
    cmds:
      - task: secrets:history
      - task: infra:lint
      - task: py:lint
      - task: py:types
      - task: gates:test
      - task: release:test
      - task: measure:test
      - task: channels:test
      - task: fmt:check
      - task: vet
      - task: lint
      - task: vuln
      - task: test-race
      - task: build
      - task: dev:check
      - task: dev:test
      - task: loop:check
      - task: docs:check
      - task: site:check
      - task: site:audit
      - task: install:test
      - task: corpus:test
      - task: coverage:check
      - task: chaos
      - task: loop:test-session

  fmt:check:
    desc: Fail if any Go file needs formatting
    cmds:
      - |
        files="$(gofmt -l ./cli/treemand)"
        if [ -n "$files" ]; then echo "needs gofmt (run: task fmt, then re-stage):"; echo "$files"; exit 1; fi

  docs:check:
    desc: Every `task X` named in docs, scripts, CI or the loop skill must exist in this Taskfile; community-health files present and consistent
    cmds:
      - bash scripts/check_task_refs.sh
      - bash scripts/community_check.sh

  site:audit:
    desc: Build and serve the site, then check every page at desktop and mobile sizes (SEO tags, accessibility, contrast, layout shift, console errors); needs hugo, node and Chrome
    cmds:
      - bash scripts/site_audit.sh

  site:check:
    desc: Fail if the built site links outside its baseURL
    cmds:
      - bash scripts/check_site_baseurl.sh

  pr:merge:
    desc: "Pass the PR's CI gate, then merge with a merge commit: task pr:merge -- N"
    cmds:
      - bash scripts/pr_merge.sh {{.CLI_ARGS}}

  # ── hooks ────────────────────────────────────────────────────────────────

  hooks:
    desc: Install the git hooks (pre-commit framework chaining task precommit, and pre-push), then verify them
    cmds:
      - sh scripts/dev/hooks.sh install
      - sh scripts/dev/hooks.sh verify

  # ── demo ─────────────────────────────────────────────────────────────────

  demo:
    desc: Record all VHS tapes and produce dist/demo.mp4
    cmds:
      - bash scripts/record-demo.sh

  demo-subcmds:
    desc: Record per-subcommand VHS tapes into www/treemand/static/demos/
    cmds:
      - bash scripts/record-subcmd-gifs.sh

  demo-all:
    desc: Record full demo video and all per-subcommand GIFs
    cmds:
      - task: demo
      - task: demo-subcmds

  demo-clean:
    desc: Remove recorded demo segments, final video, and subcmd GIFs
    cmds:
      - rm -rf demos/segments dist/demo.mp4 www/treemand/static/demos/*.gif

  # ── website ──────────────────────────────────────────────────────────────

  web:wasm:
    desc: Build the in-browser TUI (treemand.wasm + wasm_exec.js) for the Try page
    cmds:
      - cli/treemand/web/wasm/build.sh www/treemand/static/try

  web:trees:
    desc: Regenerate the CLI snapshots used by the Try page (slow; needs the CLIs installed)
    cmds:
      - scripts/gen-web-trees.sh {{.CLI_ARGS}}

  site:build:
    desc: Build the Hugo site, including the Try page wasm and the search index
    deps: [web:wasm]
    dir: www/treemand
    cmds:
      - hugo --minify
      - bash ../../scripts/site_search_index.sh public

  site:dev:
    desc: Start the Hugo dev server, including the Try page wasm
    deps: [web:wasm]
    dir: www/treemand
    cmds:
      - hugo server

  # ── misc ─────────────────────────────────────────────────────────────────

  clean:
    desc: Remove built binary
    cmds:
      - rm -f treemand
