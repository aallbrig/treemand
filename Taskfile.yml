---
# yaml-language-server: $schema=https://taskfile.dev/schema.json

version: "3"

vars:
  MODULE: github.com/aallbrig/treemand/cmd
  COMMIT:
    sh: git rev-parse --short HEAD 2>/dev/null || echo unknown
  DATE:
    sh: date -u +%Y-%m-%d
  VERSION:
    sh: git describe --tags --always --dirty 2>/dev/null || echo dev
  LDFLAGS: >-
    -X '{{.MODULE}}.Version={{.VERSION}}'
    -X '{{.MODULE}}.Commit={{.COMMIT}}'
    -X '{{.MODULE}}.BuildDate={{.DATE}}'
  GO_PKGS: ./cli/treemand/...

tasks:
  default:
    desc: List available tasks
    cmds:
      - task --list

  # ── build ────────────────────────────────────────────────────────────────

  build:
    desc: Build the treemand binary
    cmds:
      - go build -ldflags "{{.LDFLAGS}}" -o treemand ./cli/treemand

  install:
    desc: Install treemand into GOPATH/bin
    cmds:
      - go install -ldflags "{{.LDFLAGS}}" ./cli/treemand

  # ── hygiene ──────────────────────────────────────────────────────────────

  fmt:
    desc: Format Go source files with gofmt
    cmds:
      - gofmt -w ./cli/treemand

  lint:
    desc: Run golangci-lint
    cmds:
      - golangci-lint run {{.GO_PKGS}}

  lint-fix:
    desc: Run golangci-lint with auto-fix enabled
    cmds:
      - golangci-lint run --fix {{.GO_PKGS}}

  vet:
    desc: Run go vet
    cmds:
      - go vet {{.GO_PKGS}}

  vuln:
    desc: Run govulncheck for known vulnerabilities
    dir: cli/treemand
    cmds:
      - govulncheck ./...

  # ── tests ────────────────────────────────────────────────────────────────

  test:
    desc: Run all tests
    cmds:
      - go test {{.GO_PKGS}}

  test-race:
    desc: Run all tests with race detector
    cmds:
      - go test -race {{.GO_PKGS}}

  # ── composite ────────────────────────────────────────────────────────────

  hygiene:
    desc: Run all code hygiene tasks (fmt, vet, lint, vuln)
    cmds:
      - task: fmt
      - task: vet
      - task: lint
      - task: vuln

  fix:
    desc: Auto-fix everything that can be fixed (fmt + lint --fix)
    cmds:
      - task: fmt
      - task: lint-fix

  precommit:
    desc: Pre-commit gate — fmt, vet, lint, vuln, test
    cmds:
      - task: fmt
      - task: vet
      - task: lint
      - task: vuln
      - task: test

  dev:install:
    desc: Fast edit loop — test then install the binary
    cmds:
      - task: test
      - task: install

  # ── dev session (tmuxinator) ─────────────────────────────────────────────

  dev:
    desc: Start the treemand tmuxinator session, or attach if it is already running
    cmds:
      - bash scripts/dev_session.sh up

  dev:attach:
    desc: Re-attach to the running dev session without restarting it
    cmds:
      - bash scripts/dev_session.sh attach

  dev:recycle:
    desc: Kill and restart the dev session (works from outside tmux)
    cmds:
      - bash scripts/dev_session.sh recycle

  dev:stop:
    desc: Stop the dev session and everything running in it
    cmds:
      - bash scripts/dev_session.sh stop

  dev:check:
    desc: Validate the tmuxinator config without starting anything
    cmds:
      - tmuxinator debug --project-config .tmuxinator/treemand.yml >/dev/null

  # ── dev loop ─────────────────────────────────────────────────────────────

  loop:start:
    desc: Start the autonomous dev loop (creates the session if needed); runs until loop:stop
    cmds:
      - bash scripts/loop/loopctl.sh start

  loop:stop:
    desc: "Stop the dev loop at its next phase boundary (add -- --now to kill the agent immediately)"
    cmds:
      - bash scripts/loop/loopctl.sh stop {{.CLI_ARGS}}

  loop:status:
    desc: Show loop state, caps, failure streak and whether the supervisor runs
    cmds:
      - bash scripts/loop/loopctl.sh status

  loop:attach:
    desc: Attach to the loops window of the dev session
    cmds:
      - bash scripts/loop/loopctl.sh attach

  loop:agent:
    desc: Run the supervised Remote Control loop agent (used by the loops:agent pane)
    cmds:
      - bash scripts/loop/supervisor.sh

  loop:labels:
    desc: Create the GitHub labels the loop uses (idempotent)
    cmds:
      - bash scripts/loop/bootstrap-labels.sh

  loop:check:
    desc: Static checks for the loop machinery (shellcheck, state script, guard hook, skill present)
    cmds:
      - shellcheck -x -S warning scripts/loop/*.sh scripts/*.sh
      - python3 -I scripts/loop/state.py summary >/dev/null
      - bash scripts/loop/guard_test.sh
      - test -f .claude/skills/treemand-loop/SKILL.md
      - test -f .claude/skills/treemand-product-audit/SKILL.md

  visual:check:
    desc: Capture the TUI and the site (desktop + mobile) into .loop/shots/ for review
    cmds:
      - bash scripts/loop/visual-check.sh

  corpus:
    desc: Run treemand against real CLIs on this machine and print quality metrics (TSV)
    cmds:
      - bash scripts/loop/corpus.sh {{.CLI_ARGS}}

  coverage:
    desc: Per-package Go test coverage
    dir: cli/treemand
    cmds:
      - go test -cover ./...

  chaos:
    desc: Reliability suite - hostile fake CLIs must not hang, panic or exhaust memory
    cmds:
      - bash scripts/loop/chaos.sh

  perf:
    desc: Measure cold/warm time, memory and discovery quality on real CLIs (no files written)
    cmds:
      - python3 -I scripts/loop/perf.py measure

  perf:compare:
    desc: Measure and fail if any metric regressed against the last recorded version on this host
    cmds:
      - python3 -I scripts/loop/perf.py compare

  "perf:record":
    desc: "Append a measurement to docs/perf/history.tsv: task perf:record -- --version v0.4.0"
    cmds:
      - python3 -I scripts/loop/perf.py record {{.CLI_ARGS}}

  perf:show:
    desc: Performance and quality trend per CLI across recorded releases
    cmds:
      - python3 -I scripts/loop/perf.py show

  loop:test-session:
    desc: Exercise the dev session and loop control on an isolated tmux server with a stub agent
    cmds:
      - bash scripts/loop/session_test.sh

  doctor:
    desc: Show what else is running on this machine before touching real infrastructure
    cmds:
      - tmux ls 2>/dev/null || echo "no tmux sessions"
      - ss -ltnp 2>/dev/null | grep -E ':(1313|18080)\b' || echo "dev ports free"
      - git worktree list
      - bash scripts/loop/loopctl.sh status

  # ── composite gates ──────────────────────────────────────────────────────

  setup:
    desc: One-time install of tooling deps and git hooks
    cmds:
      - bash scripts/setup-hooks.sh
      - go install golang.org/x/vuln/cmd/govulncheck@latest
      - pre-commit install || true
      - echo "also needed on PATH - golangci-lint, hugo (extended), tmux, tmuxinator, watchexec, gh, jq, shellcheck, gitleaks"

  format:
    desc: Format everything
    cmds:
      - task: fmt

  ci:
    desc: All quality gates; needs no live services
    cmds:
      - task: fmt:check
      - task: vet
      - task: lint
      - task: vuln
      - task: test-race
      - task: build
      - task: dev:check
      - task: loop:check
      - task: docs:check
      - task: site:check
      - task: chaos
      - task: loop:test-session

  fmt:check:
    desc: Fail if any Go file needs formatting
    cmds:
      - test -z "$(gofmt -l ./cli/treemand)"

  docs:check:
    desc: Every `task X` named in docs, scripts, CI or the loop skill must exist in this Taskfile
    cmds:
      - bash scripts/check_task_refs.sh

  site:check:
    desc: Fail if the built site links outside its baseURL
    cmds:
      - bash scripts/check_site_baseurl.sh

  pr:merge:
    desc: "Pass the PR's CI gate, then merge with a merge commit: task pr:merge -- N"
    cmds:
      - bash scripts/pr_merge.sh {{.CLI_ARGS}}

  # ── hooks ────────────────────────────────────────────────────────────────

  hooks:
    desc: Install git hooks
    cmds:
      - bash scripts/setup-hooks.sh

  # ── demo ─────────────────────────────────────────────────────────────────

  demo:
    desc: Record all VHS tapes and produce dist/demo.mp4
    cmds:
      - bash scripts/record-demo.sh

  demo-subcmds:
    desc: Record per-subcommand VHS tapes into www/treemand/static/demos/
    cmds:
      - bash scripts/record-subcmd-gifs.sh

  demo-all:
    desc: Record full demo video and all per-subcommand GIFs
    cmds:
      - task: demo
      - task: demo-subcmds

  demo-clean:
    desc: Remove recorded demo segments, final video, and subcmd GIFs
    cmds:
      - rm -rf demos/segments dist/demo.mp4 www/treemand/static/demos/*.gif

  # ── website ──────────────────────────────────────────────────────────────

  web:wasm:
    desc: Build the in-browser TUI (treemand.wasm + wasm_exec.js) for the Try page
    cmds:
      - cli/treemand/web/wasm/build.sh www/treemand/static/try

  web:trees:
    desc: Regenerate the CLI snapshots used by the Try page (slow; needs the CLIs installed)
    cmds:
      - scripts/gen-web-trees.sh {{.CLI_ARGS}}

  site:build:
    desc: Build the Hugo site, including the Try page wasm
    deps: [web:wasm]
    dir: www/treemand
    cmds:
      - hugo --minify

  site:dev:
    desc: Start the Hugo dev server, including the Try page wasm
    deps: [web:wasm]
    dir: www/treemand
    cmds:
      - hugo server

  # ── misc ─────────────────────────────────────────────────────────────────

  clean:
    desc: Remove built binary
    cmds:
      - rm -f treemand
